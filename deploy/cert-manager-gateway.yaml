# Overlay for the existing cert-manager 1.19.x release.
# Gateway API CRDs must be installed first; restart cert-manager after applying.
#
#   helm upgrade cert-manager jetstack/cert-manager \
#     --namespace cert-manager \
#     --version v1.19.3 \
#     --reuse-values \
#     -f deploy/cert-manager-gateway.yaml
#   kubectl rollout restart deployment/cert-manager -n cert-manager

config:
  enableGatewayAPI: true
