# Traefik Proxy v3 — replacement for retired kubernetes/ingress-nginx.
# Chart: traefik/traefik 41.2.0 (app v3.7.10)
#
#   helm repo add traefik https://traefik.github.io/charts
#   helm upgrade --install traefik traefik/traefik \
#     --namespace traefik --create-namespace \
#     --version 41.2.0 \
#     -f deploy/traefik-values.yaml
#
# On k3s this expects `--disable=traefik` so the bundled controller is not running.
# HTTP→HTTPS redirect is done at the entrypoint (ACME HTTP-01 is bypassed).
# Gateway API: install standard CRDs first (see deploy/MIGRATION.md).
# Listener ports must equal entrypoint bind ports AND be 80/443 for cert-manager.

image:
  tag: v3.7.10

deployment:
  replicas: 1
  kind: Deployment

# Non-root + bind :80/:443 (required so Gateway listeners can use those ports).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
    statusAddress:
      service:
        enabled: true
  kubernetesIngressNGINX:
    enabled: false

gatewayClass:
  enabled: true
  name: traefik

gateway:
  enabled: true
  name: traefik-gateway
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 443
      protocol: HTTPS
      mode: Terminate
      namespacePolicy:
        from: All
      certificateRefs:
        - name: stargate-stack-tls
          kind: Secret
          group: ""

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    # Let cert-manager HTTP-01 hit :80 without the forced HTTPS redirect.
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    http:
      tls:
        enabled: true

service:
  enabled: true
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local

log:
  level: INFO

accessLog:
  enabled: true
  format: common

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
