# Traefik common access log — 404s on known scanner / webshell paths.
# Matches both no-route 404s and backend 404s (wp-login, *.php, .env, …).

[Definition]

failregex = ^<HOST> \- \S+ \[\] \"(?:GET|HEAD|POST) /(?:(?i)[^\s\"]*\.php(?:\?[^\s\"]*)?|wp-(?:login|admin|cron|content|includes)[^\s\"]*|xmlrpc\.php[^\s\"]*|\.env|\.git[^\s\"]*|phpmyadmin[^\s\"]*|pma/[^\s\"]*|adminer[^\s\"]*|cgi-bin[^\s\"]*|actuator[^\s\"]*|vendor/phpunit[^\s\"]*|manager/html[^\s\"]*|boaform[^\s\"]*|solr/[^\s\"]*|hudson[^\s\"]*|jenkins[^\s\"]*) \S+\" 404\b

ignoreregex = \/.well-known\/acme-challenge\/

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S(?: %%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
