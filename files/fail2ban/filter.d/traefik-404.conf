# Traefik common access log — 404s that never matched a router.
#
# Scanners hitting the LB IP / wrong Host get Traefik's default 404 with
# router="-" and backend="-". App-level 404s (matched HTTPRoute) keep a
# real router name and are ignored so missing API paths do not ban users.
#
# After fail2ban strips the CLF date, a no-route line looks like:
#   4.204.200.136 - - [] "GET /wp-login.php HTTP/1.1" 404 19 "-" "-" 21513 "-" "-" 0ms

[Definition]

failregex = ^<HOST> \- \S+ \[\] \"(?:GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS) [^\"]+\" 404 \d+ \"[^\"]*\" \"[^\"]*\" \S+ \"-\"

ignoreregex = \/.well-known\/acme-challenge\/

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S(?: %%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
